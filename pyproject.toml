[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-devlop-cli"
dynamic = ["version"]
description = "Install the bundled requirement and design skills for Codex or Hermes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-devlop = "ai_devlop.cli:main"

[tool.hatch.version]
path = "src/ai_devlop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_devlop"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/ai-devlop-spec" = "ai_devlop/resources/skills/ai-devlop-spec"
".agents/skills/ai-devlop-plan" = "ai_devlop/resources/skills/ai-devlop-plan"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", ".agents/skills", "pyproject.toml", "README.md"]
